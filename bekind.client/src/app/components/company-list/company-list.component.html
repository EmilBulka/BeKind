<table *ngIf="companies">
    <thead>
        <tr>
            <th>Company Name</th>
            <th>Is Notify Active</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let company of companies">
          <td>{{ company.name }}</td>
          <td>{{ company.isNotifyActive }}</td>
        </tr>
    </tbody>
</table>
